<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>調査用データ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .debug label { display: block; margin: 8px 0 4px; font-size: 14px; color: var(--sub); }
    .debug input {
      width: 100%; font-size: 17px; padding: 10px 12px; border: none; border-radius: 10px;
      background: var(--field); color: var(--text);
    }
    .debug .primary { margin-top: 16px; }
    #log { white-space: pre-wrap; font-size: 12px; color: var(--sub); margin-top: 12px; word-break: break-all; }
    #saveArea { margin-top: 12px; }
  </style>
</head>
<body>
  <header class="topbar"><h1>調査用データ</h1></header>
  <main>
    <div class="card debug">
      <p>前後のダイヤを作るために、Yahoo!乗換案内の「検索結果」「駅」「時刻表」のページをそのまま保存します。
        できたファイルを Claude とのチャットに添付してください。個人情報は含まれません。</p>
      <label for="from">出発駅</label>
      <input id="from" value="知立">
      <label for="to">到着駅</label>
      <input id="to" value="岐大口">
      <button class="primary" id="run" type="button">データを作る</button>
      <div id="saveArea"></div>
      <div id="log"></div>
    </div>
  </main>
  <script>
  'use strict';
  const $ = (id) => document.getElementById(id);
  const log = (s) => { $('log').textContent += s + '\n'; };
  const pad = (n) => String(n).padStart(2, '0');

  // 前回検索した区間があればそれを使う
  try {
    const h = JSON.parse(localStorage.getItem('norikae:history') || '[]')[0];
    if (h && h.from && h.to) { $('from').value = h.from; $('to').value = h.to; }
  } catch (e) { /* なくてもよい */ }

  async function getPage(path) {
    const res = await fetch('api/debug/yahoo?path=' + encodeURIComponent(path));
    const text = await res.text();
    log(`${res.status} ${res.headers.get('x-upstream-status') || ''} ${path.slice(0, 80)} (${text.length}文字)`);
    return text;
  }

  // ページ内のリンクのうち、指定の種類のものを集める
  function links(html, re) {
    const out = [];
    const all = html.match(/href="([^"]+)"/g) || [];
    for (const a of all) {
      let u = a.slice(6, -1).replace(/&amp;/g, '&');
      if (u.startsWith('https://transit.yahoo.co.jp')) u = u.slice('https://transit.yahoo.co.jp'.length);
      if (re.test(u) && !out.includes(u)) out.push(u);
    }
    return out;
  }

  $('run').addEventListener('click', async () => {
    $('run').disabled = true;
    $('log').textContent = '';
    $('saveArea').textContent = '';
    const parts = [];
    const add = (path, html) => parts.push(`\n\n===== ${path} =====\n\n${html}`);
    try {
      const now = new Date();
      const q = new URLSearchParams({
        from: $('from').value.trim(), to: $('to').value.trim(),
        y: now.getFullYear(), m: pad(now.getMonth() + 1), d: pad(now.getDate()), hh: pad(now.getHours()),
        m1: Math.floor(now.getMinutes() / 10), m2: now.getMinutes() % 10,
        type: 1, ticket: 'ic', expkind: 1, userpass: 1, ws: 3, s: 0, al: 1, shin: 1, ex: 1, hb: 1, lb: 1, sr: 1,
      });
      const resultPath = '/search/result?' + q;
      const result = await getPage(resultPath);
      add(resultPath, result);

      // 検索結果から駅・時刻表へのリンク
      const stationLinks = links(result, /^\/station\//);
      let timetableLinks = links(result, /^\/timetable\//);
      log(`駅リンク ${stationLinks.length} 件 / 時刻表リンク ${timetableLinks.length} 件`);

      // 出発駅のページ
      if (stationLinks[0]) {
        const st = await getPage(stationLinks[0]);
        add(stationLinks[0], st);
        timetableLinks = timetableLinks.concat(links(st, /^\/timetable\//).filter((u) => !timetableLinks.includes(u)));
      }

      // 時刻表ページ（最大 3 つ）と、その中の列車ごとのページ（1 つ）
      let trainPageDone = false;
      for (const t of timetableLinks.slice(0, 3)) {
        const tt = await getPage(t);
        add(t, tt);
        if (!trainPageDone) {
          const inner = links(tt, /^\/timetable\//).filter((u) => !timetableLinks.includes(u));
          log(`  時刻表の中のリンク ${inner.length} 件`);
          if (inner[0]) { add(inner[0], await getPage(inner[0])); trainPageDone = true; }
        }
      }

      const text = `作成: ${now.toISOString()}\n${navigator.userAgent}` + parts.join('');
      const file = new File([text], 'yahoo-pages.txt', { type: 'text/plain' });
      log(`\nできました（${Math.round(text.length / 1024)} KB）`);

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        const b = document.createElement('button');
        b.className = 'primary';
        b.textContent = '共有する（Claude のアプリを選ぶ）';
        b.addEventListener('click', () => navigator.share({ files: [file] }).catch(() => {}));
        $('saveArea').append(b);
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = 'yahoo-pages.txt';
      a.textContent = 'ファイルとして保存する';
      a.className = 'secondary';
      a.style.textAlign = 'center';
      a.style.textDecoration = 'none';
      $('saveArea').append(a);
    } catch (e) {
      log('エラー: ' + e.message);
    }
    $('run').disabled = false;
  });
  </script>
</body>
</html>
